# 跨交易所订单簿服务配置文件
# 通过 src/common/config.py 加载，支持点路径访问，如 cfg.get('orderbook.settle')

# 用户认证配置
auth:
  # Token 签名密钥 (生产环境务必修改为强随机字符串)
  secret_key: 'arbitrage-mi-secret-key-2026'
  # Token 有效期 (秒)，默认 1 小时
  token_expire_seconds: 36000

orderbook:
  # 永续合约结算币种（小写），用于拼接 Gate 合约名（如 BTC_USDT）
  settle: usdt
  # 最大订阅合约数（从 mi_base_asset 加载的上限）
  max_contracts: 999
  # 进程启动后自动启动 WS 服务（设为 true 则崩溃重启后自动恢复连接）
  auto_start: true

  # WebSocket 向前端广播订单簿快照的最小间隔（秒），用于节流
  broadcast_throttle_sec: 1.0
  # 启动阶段批量加载 REST 初始快照时，每批合约数量
  snapshot_batch_size: 40
  # 单批快照加载的最大并发线程数
  snapshot_batch_workers: 40

trade:
  # ─── 成交引擎 ───
  executor:
    url: http://localhost:8081    # 虚拟盘地址
    # url: http://localhost:8082    # 实盘地址
    timeout_sec: 15                # HTTP 请求超时（秒）

  # ─── 手续费率 ───
  fee:
    spot_open: 0.00075
    spot_close: 0.00075
    future_open: 0.0005
    future_close: 0.0005

  # ─── 开仓策略 ───
  open:
    amount_usdt: 10                        # 单笔开仓金额（USDT）
    check_interval_sec: 5                   # 开仓检查间隔（秒）
    cooldown_sec: 15                        # 同标的开仓冷却（秒）
    reject_cooldown_sec: 300                # 被交易所拒单后冷却（秒），避免重复提交失败订单
    max_positions_per_asset: 3              # 同标的最大持仓数
    # max_positions_per_asset: 1              # 同标的最大持仓数
    vwap_basis_threshold_bps: 20            # 全局回退VWAP基差阈值（bps）
    orderbook_coverage_threshold: 0.8       # 盘口覆盖阈值（<= 此值显示绿色）
    risk_relief_bps: -5                     # 风险缓释（bps）

  # ─── 开仓过滤 ───
  filter:
    # 资金费率阈值百分位（对应 mi_gate_future_funding_rate_threshold 表字段名）
    funding_rate_threshold_percentile: percentile_30
    # 现货24h成交额低于此值不开仓
    min_spot_volume_24h_usdt: 100000
    # 期货24h成交额低于此值不开仓
    min_future_volume_24h_usdt: 50000

  # ─── 峰值回落策略（开仓确认） ───
  peak_pullback:
    pullback_pct: 0.10                      # 从峰值回落百分比(10%)确认开仓
    monitor_timeout_sec: 300                # 监控超时（秒），超时后直接开仓
    timeout_cooldown_sec: 300               # 超时开仓后冷却期（秒）

  # ─── 平仓策略 ───
  close:
    check_interval_sec: 5                   # 平仓检查间隔（秒）
    cooldown_sec: 60                        # 平仓失败冷却（秒）
    take_profit_days_multiplier: 15         # 止盈倍数（总盈亏bps >= 24h费率bps * 此值 + 手续费bps）
    # take_profit_days_multiplier: 2         # 止盈倍数（总盈亏bps >= 24h费率bps * 此值 + 手续费bps）
    max_funding_payments: 30                # 最大资金费支付次数，超过强制平仓
    # max_funding_payments: 2                # 最大资金费支付次数，超过强制平仓

  # ─── 谷底反弹策略（平仓确认） ───
  valley_rebound:
    rebound_pct: 0.10                       # 从谷底反弹百分比(10%)确认平仓
    monitor_timeout_sec: 60                 # 监控超时（秒），超时后直接平仓

  # ─── VWAP基差阈值 ───
  vwap:
    snapshot_interval_sec: 10               # 快照采样间隔（秒）
    snapshot_retention_days: 60             # 快照保留天数
    threshold_lookback_days: 7              # 阈值回溯天数（用于每日统计分析）
    # 可选值: open_basis_p10 / open_basis_p20 / open_basis_p30 / open_basis_p40
    open_threshold_percentile: open_basis_p20
    # 可选值: close_basis_p10 / close_basis_p20 / close_basis_p30 / close_basis_p40
    close_threshold_percentile: close_basis_p20

  # ─── 持仓管理 ───
  position:
    funding_update_sec: 3600                # 资金费更新间隔（秒）
    push_interval_sec: 5                    # 实时数据推送间隔（秒）

# 保证金风控配置（逐仓模式）
margin:
  # 杠杆倍数（用于计算初始保证金和爆仓价）
  leverage: 2
  # 默认维持保证金率（当合约表无数据时的回退值）
  default_maintenance_rate: 0.005
  # 距爆仓预警阈值(%)：低于此值时禁止该标的新开仓 + 前端告警
  warning_pct: 15
  # 距爆仓平仓阈值(%)：低于此值时触发两端同时平仓
  close_threshold_pct: 10

# 资金管理配置
capital:
  # Binance 初始入金 (USDT)
  binance_initial: 500
  # Gate 初始入金 (USDT)
  gate_initial: 250

# 真实成交引擎配置（仅 real_executor_service 使用）
# API Key/Secret 从 .env 环境变量读取，此处仅配置 URL 和超时
real_executor:
  # 环境: testnet / mainnet（模拟盘/实盘，也可通过 EXCHANGE_ENV 环境变量覆盖）
  env: testnet
  # HTTP 请求超时（秒）
  timeout_sec: 10