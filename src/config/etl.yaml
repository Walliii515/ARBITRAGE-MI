# ETL 任务调度配置文件
# 用于统一管理所有 ETL 任务的调度参数
# 
# 调度类型说明：
# - interval: 固定间隔执行（分钟），由 interval_minutes 控制
# - daily: 每天固定时刻执行，由 daily_hour 和 daily_minute 控制
#
# 字段说明：
# - enabled: 是否启用该任务（true/false）
# - interval_minutes: 执行间隔分钟数（仅 interval 类型有效）
# - run_on_startup: 服务启动时是否立即执行一次（仅 interval 类型有效）
# - daily_hour: 每天执行的小时（0-23，仅 daily 类型有效）
# - daily_minute: 每天执行的分钟（0-59，仅 daily 类型有效）

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 全局配置
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# 默认 ETL 刷新间隔（分钟）
# 当任务未指定 interval_minutes 时使用此默认值
default_interval_minutes: 15

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ETL 任务配置
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

tasks:
  # ─────────────────────────────────────────────────────
  # interval 类型：固定间隔执行
  # ─────────────────────────────────────────────────────

  # Gate.io 永续合约信息更新
  # 数据源：Gate.io Futures API (contracts + tickers)
  # 目标表：mi_gate_future_contracts
  # 更新策略：全删全进
  # 写入内容：合约基本信息 + 24h 成交额 + 当期资金费率 + 下次支付时间
  update_gate_contracts:
    enabled: true
    schedule: interval
    interval_minutes: 5  # 每 5 分钟执行一次（资金费率对开仓/平仓决策影响大，需及时更新）
    run_on_startup: true  # 服务启动时立即执行一次

  # Binance 现货交易对信息更新
  # 数据源：Binance exchangeInfo API + 24h Ticker API
  # 目标表：mi_binance_spot_info
  # 更新策略：全删全进
  # 写入内容：交易对基本信息 + 24h 报价成交额
  update_binance_spot:
    enabled: true
    schedule: interval
    interval_minutes: 15  # 每 15 分钟执行一次
    run_on_startup: true  # 服务启动时立即执行一次

  # 资金费率分位阈值计算
  # 数据源：mi_gate_future_his_funding_rates（最近 30 天）
  # 目标表：mi_gate_future_funding_rate_threshold
  # 更新策略：UPSERT（按 contract 唯一键）
  # 计算内容：每个合约正的 24h 资金费率的 20%/30%/40% 分位数、最大值、最小值
  # 用途：前端资金费率过滤开关的阈值依据
  calc_funding_rate_threshold:
    enabled: true
    schedule: interval
    interval_minutes: 15  # 每 15 分钟执行一次
    run_on_startup: true  # 服务启动时立即执行一次

  # 标的行情画像刷新
  # 用途：把低于普通 B 流动性标准、但仍进入订阅池的标的标为 thin_bursty，
  #      供开仓状态机使用“宽监控 + 严执行 + 小仓位”参数。
  update_asset_market_profiles:
    enabled: true
    schedule: interval
    interval_minutes: 15
    run_on_startup: true

  # Gate.io 历史资金费率更新
  # 数据源：Gate.io Futures Funding Rate History API（每批最多 10 个合约）
  # 目标表：mi_gate_future_his_funding_rates
  # 更新策略：增量更新（INSERT IGNORE，按 contract+timestamp 唯一索引去重）
  # 写入内容：每个合约的历史资金费率（funding_rate, funding_rate_24h, timestamp）
  # 用途：为后续阈值计算提供历史样本
  update_funding_rate_history:
    enabled: true
    schedule: interval
    interval_minutes: 60  # 每 1 小时执行一次
    run_on_startup: false  # 服务启动时不立即执行，等待 interval_minutes 后首次执行

  # ─────────────────────────────────────────────────────
  # daily 类型：每天固定时刻执行
  # ─────────────────────────────────────────────────────

  # VWAP 基差快照数据清理
  # 目标表：mi_vwap_basis_snapshot
  # 操作：DELETE 超过保留天数的历史快照记录
  # 保留天数：由 config.yaml 的 trade.vwap_snapshot_retention_days 控制（默认 14 天）
  cleanup_vwap_snapshots:
    enabled: true
    schedule: daily
    daily_hour: 1  # 凌晨1点执行清理，与阈值计算错开避免争抢资源
    daily_minute: 0

  # VWAP 基差分位阈值 - 每日批量统计
  # 数据源：mi_vwap_basis_snapshot（最近 7 天的实时快照）
  # 目标表：mi_vwap_basis_threshold
  # 更新策略：UPSERT（按 base_asset + calc_date 唯一键）
  # 计算内容：
  #   - 开仓：按 base_asset 分组，计算 open_vwap_basis_bps 的 max/min/mean/std/p10~p40
  #   - 平仓：按 base_asset 分组，计算 close_vwap_basis_bps 的 max/min/mean/std/p10~p40
  # 用途：按标的设置差异化开仓/平仓 VWAP 基差阈值
  # 业务开关：同时受 config.yaml 的 trade.vwap.update_threshold_enabled 控制；
  #          关闭后系统仍会写 mi_vwap_basis_snapshot，但不会更新 mi_vwap_basis_threshold
  daily_vwap_threshold:
    enabled: true
    schedule: daily
    daily_hour: 0  # 凌晨0点执行阈值计算
    daily_minute: 5  # 延迟5分钟，避免与其他凌晨0点任务撞车

  # 反向策略高负 Funding 概率预测 - 每日批量统计
  # 数据源：mi_gate_future_his_funding_rates + mi_gate_future_contracts
  # 目标表：mi_reverse_funding_prediction
  # 用途：预测未来 1/2/3 期出现 24h funding <= threshold_rate 的概率，
  #      供提前借币观察页面和后续研究复盘使用。
  daily_reverse_funding_prediction:
    enabled: true
    schedule: daily
    daily_hour: 0
    daily_minute: 20
    threshold_rate: -0.01
    lookback_days: 30
