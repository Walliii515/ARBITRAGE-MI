# 跨交易所订单簿服务配置文件
# 通过 src/common/config.py 加载，支持点路径访问，如 cfg.get('orderbook.settle')

# 用户认证配置
auth:
  # Token 签名密钥 (生产环境务必修改为强随机字符串)
  secret_key: 'arbitrage-mi-secret-key-2026'
  # Token 有效期 (秒)，默认 1 小时
  token_expire_seconds: 36000

trade:
  # 运行模式（统一开关）：virtual=虚拟盘(本地账本) / testnet=模拟盘(交易所Testnet) / live=实盘
  # 主变量，trade.executor.url 和 real_executor.env 均由本参数派生。可用 TRADE_MODE 环境变量临时覆盖。
  # mode: virtual
  mode: live

  # ─── 成交引擎 ───
  executor:
    # url: 默认由 trade.mode 派生（virtual→08081，testnet/live→08082）
    # 如需自定义主机/端口可取消下行注释覆盖：
    # url: http://localhost:8082
    timeout_sec: 15                # HTTP 请求超时（秒）

  # ─── 手续费率 ───
  fee:
    spot_open: 0.00075
    spot_close: 0.00075
    future_open: 0.0005
    future_close: 0.0005

  # ─── 开仓策略 ───
  open:
    amount_usdt: 10                        # 单笔开仓金额（USDT）
    check_interval_sec: 0.2                 # 开仓检查间隔（秒）；WS 盘口 100ms、循环 200ms，采样不浪费
    cooldown_sec: 60                        # 同标的开仓冷却（秒）
    reject_cooldown_sec: 300                # 被交易所拒单后冷却（秒），避免重复提交失败订单
    max_positions_per_asset: 1              # 同标的最大持仓数
    # max_positions_per_asset: 1              # 同标的最大持仓数
    vwap_basis_threshold_bps: 50            # 全局回退VWAP基差阈值（bps）
    orderbook_coverage_threshold: 0.6       # 盘口覆盖阈值（<= 此值显示绿色）
    risk_relief_bps: -5                     # 风险缓释（bps）
    min_funding_rate_bps: 0                # 24h资金费率下限(bps)，低于此值不开仓
    max_orderbook_lag_ms: 5000             # 本地最近一次 WS 盘口距下单时刻的最大允许延迟（ms）

  # ─── 开仓过滤 ───
  filter:
    # 资金费率阈值百分位（对应 mi_gate_future_funding_rate_threshold 表字段名）
    funding_rate_threshold_percentile: percentile_30
    # 现货24h成交额低于此值不开仓
    min_spot_volume_24h_usdt: 100000
    # 期货24h成交额低于此值不开仓
    min_future_volume_24h_usdt: 50000

  # ─── 峰值回落 + sustain 确认（开仓唯一通道） ───
  peak_pullback:
    pullback_pct: 0.05                      # 从峰值回落百分比(5%)确认开仓
    sustain_sec: 1.5                          # 峰值监控最低持续秒数（过滤脉冲信号），从大于P20开始计算，防止1秒内迅速拉升回调的信号
    monitor_timeout_sec: 60                 # 监控超时（秒），超时后直接放弃
    timeout_cooldown_sec: 300               # 超时冷却期（秒），超时放弃后，基差大概率仍在 p20 之上。没有冷却的话，下一个 0.2s 循环会立刻检测到"基差 ≥ p20"，于是重新进入峰值监控状态机，

  # ─── 开仓盘口恢复确认 ───
  # 当开仓信号已经完成“峰值回落”确认后，系统不会立刻下单，而是进入最多 3.0 秒的盘口恢复观察期；
  # 在这段时间里，至少需要采集到 3 个有效盘口样本；被冲击的开仓侧深度要恢复到监控起点的 65% 以上；
  # spot/future 的买卖价差相对窗口起点不能扩大超过 8bps；
  # 开仓基差在窗口内的波动不能超过 6bps。如果这些条件连续满足 0.4 秒，就认为盘口已经恢复，可以进入最终旁路检查并准备开仓；
  resiliency:
    enabled: true
    window_sec: 3.0                         # 最近窗口内观察盘口恢复
    min_samples: 2                          # 窗口内最少样本数
    min_recovery_ratio: 0.65                # 被冲击侧深度需恢复到监控起点的比例
    max_spread_widen_bps: 8                 # spot/future 买卖价差相对窗口起点最大扩大
    max_basis_volatility_bps: 6             # 窗口内开仓基差最大波动
    min_hold_sec: 0.4                       # 恢复条件连续满足时长
    max_wait_sec: 5.0                       # 等待恢复超时后放弃本轮信号

  # ─── 平仓策略 ───
  close:
    check_interval_sec: 0.2                 # 平仓检查间隔（秒）；与开仓对称
    cooldown_sec: 60                        # 平仓失败冷却（秒）
    take_profit_days_multiplier: 10         # 止盈倍数（总盈亏bps >= percentile_40费率bps * 此值 + 手续费bps）
    # take_profit_days_multiplier: 2         # 止盈倍数（总盈亏bps >= percentile_40费率bps * 此值 + 手续费bps）
    max_funding_payments: 30                # 最大资金费支付次数，超过强制平仓
    # max_funding_payments: 2                # 最大资金费支付次数，超过强制平仓
    funding_cost_tolerance_ratio: 0.2        # 累计资金费超过预期收敛空间此比例时平仓
    funding_cost_min_threshold_bps: 10       # 累计资金费收敛空间保底值(bps)，防止open/close倒挂时阈值为0
    max_orderbook_lag_ms: 500               # 旁路风控新鲜度硬约束：本地最近一次 WS 盘口距下单时刻的最大允许延迟（ms）

  # ─── 谷底反弹策略（平仓确认） ───
  valley_rebound:
    rebound_pct: 0.10                       # 从谷底反弹百分比(10%)确认平仓
    monitor_timeout_sec: 60                 # 监控超时（秒），超时后直接平仓

  # ─── 止盈平仓盘口恢复确认 ───
  close_resiliency:
    enabled: true
    window_sec: 1.5
    min_samples: 3
    min_recovery_ratio: 0.55
    max_spread_widen_bps: 10
    max_basis_volatility_bps: 8
    max_basis_rebound_bps: 8                # 等待恢复期间平仓基差允许回弹上限
    min_hold_sec: 0.3
    max_wait_sec: 1.5                       # 止盈平仓等待超时后交给最终旁路判定，不无限等待
    coverage_threshold: 0.6

  # ─── VWAP基差阈值 ───
  vwap:
    snapshot_interval_sec: 10               # 快照采样间隔（秒）
    snapshot_retention_days: 60             # 快照保留天数
    update_threshold_enabled: true           # 是否由系统更新 mi_vwap_basis_threshold；false 时仅保留 mi_vwap_basis_snapshot 快照
    threshold_lookback_days: 7              # 阈值回溯天数（用于每日统计分析）
    # 平仓基差阈值分位列（用于开仓盈利性守卫：开仓基差需明显高于未来可能的平仓基差）
    # 可选值: close_basis_p10 / close_basis_p20
    close_threshold_percentile: close_basis_p20

  # ─── 持仓管理 ───
  position:
    funding_update_sec: 3600                # 资金费更新间隔（秒）
    push_interval_sec: 5                    # 实时数据推送间隔（秒）

# 保证金风控配置（逐仓模式）
margin:
  # 杠杆倍数（用于计算初始保证金和爆仓价）
  leverage: 2
  # 默认维持保证金率（当合约表无数据时的回退值）
  default_maintenance_rate: 0.005
  # 距爆仓预警阈值(%):低于此值时禁止该标的新开仓 + 前端告警
  warning_pct: 15
  # 距爆仓平仓阈值(%)：低于此值时触发两端同时平仓
  close_threshold_pct: 5

# 资金管理配置
capital:
  # Binance 初始入金 (USDT)
  binance_initial: 500
  # Gate 初始入金 (USDT)
  gate_initial: 250

# 真实成交引擎配置（仅 real_executor_service 使用）
# API Key/Secret 从 .env 环境变量读取，此处仅配置其他运行参数
# 注：交易所环境（mainnet/testnet）由顶层 trade.mode 统一控制，不再在此重复配置
real_executor:
  # HTTP 请求超时（秒）
  timeout_sec: 10

orderbook:
  # 永续合约结算币种（小写），用于拼接 Gate 合约名（如 BTC_USDT）
  settle: usdt
  # 最大订阅合约数（从 mi_base_asset 加载的上限）
  max_contracts: 999
  # Gate OBU WS 连接分片数；若 max_contracts=250 且 level=50，建议设为 5
  gate_ws_shards: 5
  # Gate OBU 深度，实测可用: 50 / 400；系统输出仍只取前20档
  gate_obu_level: 50
  # Gate WS 建连等待时间；高延迟网络下需要比默认 8 秒更宽松
  gate_ws_connect_timeout_sec: 30
  # Gate 订阅/退订控制帧最小发送间隔（毫秒），覆盖启动订阅、重连补订阅和缺口重订阅
  gate_subscribe_interval_ms: 100
  # Gate WS 自动重连随机抖动上限（秒），避免多个分片同频重连
  gate_reconnect_jitter_sec: 2.0
  # Binance Spot WS 连接分片数；若 max_contracts=250 且 speed=100ms，建议设为 5
  binance_ws_shards: 5
  # Binance Partial Depth 推送频率，可选: 100ms / 1000ms
  binance_ws_speed: 100ms
  # 盘口超过该秒数无更新时，不参与交易计算
  stale_timeout_sec: 30
  # 进程启动后自动启动 WS 服务（设为 true 则崩溃重启后自动恢复连接）
  auto_start: true
  # 独立盘口数据服务地址。orderbook_server 通过该服务读取 Binance/Gate 本地盘口。
  data_service_url: http://127.0.0.1:19877
  data_service_host: 0.0.0.0
  data_service_port: 19877
  data_service_timeout_sec: 2.0

  # WebSocket 向前端广播订单簿快照的最小间隔（秒），用于节流
  broadcast_throttle_sec: 2.0
