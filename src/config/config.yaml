# 跨交易所订单簿服务配置文件
# 通过 src/common/config.py 加载，支持点路径访问，如 cfg.get('orderbook.settle')

# 用户认证配置
auth:
  # Token 签名密钥 (生产环境务必修改为强随机字符串)
  secret_key: 'arbitrage-mi-secret-key-2026'
  # Token 有效期 (秒)，默认 1 小时
  token_expire_seconds: 36000

trade:
  # 运行模式（统一开关）：virtual=虚拟盘(本地账本) / testnet=模拟盘(交易所Testnet) / live=实盘
  # 主变量，trade.executor.url 和 real_executor.env 均由本参数派生。可用 TRADE_MODE 环境变量临时覆盖。
  # mode: virtual
  mode: live

  # ─── 成交引擎 ───
  executor:
    # url: 默认由 trade.mode 派生（virtual→08081，testnet/live→08082）
    # 如需自定义主机/端口可取消下行注释覆盖：
    # url: http://localhost:8082
    timeout_sec: 15                # HTTP 请求超时（秒）

  # ─── 手续费率 ───
  fee:
    spot_open: 0.00075
    spot_close: 0.00075
    future_open: 0.0002                  # Gate future maker 开仓账户费率
    future_close: 0.0002                 # Gate future maker 平仓账户费率
    future_taker_open: 0.0005            # Gate future taker/IOC 开仓账户费率
    future_taker_close: 0.0005           # Gate future taker/IOC 平仓账户费率

  # ─── 执行策略 ───
  execution:
    future_maker_open:
      enabled: true                         # 开仓先尝试 Gate future post-only maker
      allowed_tiers: [A, B]                 # A/B 档参与；C 档不订阅、不交易
      ttl_ms: 1000                          # maker 单最多挂单等待时间
      price_offset_bps: 0                   # 卖空挂 future ask1；正数表示更靠后排队
      fallback_ioc_enabled: true            # maker未成交后，若安全垫仍够，转保护IOC兜底
      fallback_allowed_tiers: [A, B]        # 允许 maker->IOC 兜底的分层
      fallback_min_buffer_bps: 8            # fallback 时 pre_gate 至少高于 entry_floor 的额外安全垫
      fallback_slippage_bps: 5              # 开仓future卖出IOC保护价低于旁路VWAP的最大bps
      spot_hedge_protective_ioc_enabled: true # future maker/fallback 成交后，spot 买入改用保护性IOC
    future_maker_close:
      enabled: true                         # 平仓先尝试 Gate future reduce-only post-only maker
      allowed_tiers: [A, B]                 # A/B 档参与；未知历史持仓按 B 档处理
      ttl_ms: 1000                          # maker 单最多挂单等待时间
      price_offset_bps: 0                   # 买回挂 future bid1；正数表示更靠后排队
      fallback_ioc_enabled: true            # maker未成交后，转reduce-only保护IOC兜底
      fallback_allowed_tiers: [A, B]        # 允许平仓 maker->IOC 兜底的分层

  # ─── 开仓策略 ───
  open:
    amount_usdt: 10                        # 单笔开仓金额（USDT）
    check_interval_sec: 0.2                 # 开仓检查间隔（秒）；WS 盘口 100ms、循环 200ms，采样不浪费
    cooldown_sec: 60                        # 同标的开仓冷却（秒）
    reject_cooldown_sec: 60                 # 被交易所拒单后冷却（秒），避免重复提交失败订单
    min_available_ratio: 0.10               # Binance/Gate 下单后可用资金不得低于各自总资金的比例
    max_asset_exposure_ratio: 0.10          # 单标的 spot开仓额 / future当前保证金 均不得超过各自总资金比例
    vwap_basis_threshold_bps: 50            # 全局回退VWAP基差阈值（bps）
    orderbook_coverage_threshold: 0.6       # 盘口覆盖阈值（<= 此值显示绿色）
    risk_relief_bps: -5                     # 风险缓释（bps）
    min_funding_rate_bps: 0                # 24h资金费率下限(bps)，低于此值不开仓
    max_orderbook_lag_ms: 500             # 本地最近一次 WS 盘口距下单时刻的最大允许延迟（ms）

  # ─── 开仓过滤 ───
  filter:
    # 资金费率阈值百分位（对应 mi_gate_future_funding_rate_threshold 表字段名）
    funding_rate_threshold_percentile: percentile_30
    # 现货24h成交额低于此值不开仓
    min_spot_volume_24h_usdt: 100000
    # 期货24h成交额低于此值不开仓
    min_future_volume_24h_usdt: 50000

  # ─── 峰值回落 + sustain 确认（开仓回落通道） ───
  peak_pullback:
    pullback_pct: 0.05                      # 从峰值回落百分比(5%)确认开仓
    sustain_sec: 1.5                        # 峰值监控最低持续秒数（过滤脉冲信号），从大于P20开始计算，防止1秒内迅速拉升回调的信号
    monitor_timeout_sec: 60                 # 监控超时（秒），基差长期不回落时转为 timeout 直开候选，继续走盘口恢复和旁路风控
    timeout_cooldown_sec: 10                # timeout直开候选失败后短冷却，避免行情滞后时反复刷同标的

  # ─── 动量开仓通道 ───
  # 用于高流动性标的在“超阈值 + 上升期 + 盘口好”时直接进入最终旁路，不等待回调。
  # “超阈值”指达到 funding_adjusted_entry 计算出的 entry_floor，不再是单独的 p20。
  # 只对 A 级标的启用；B 级仍走 pullback + resiliency + rebound，C 级不订阅 WS。
  momentum_open:
    enabled: true
    allowed_tiers: [A]                      # 只有 A 级主交易池允许动量直开
    window_sec: 1.2                         # 默认短窗口；可被 tier_overrides 覆盖
    min_samples: 3                          # 默认动量判断最少样本数
    min_rise_bps: 3                         # 默认窗口内基差最小上升幅度
    min_basis_buffer_bps: 8                 # 默认当前基差需高于 p20 的额外安全垫
    safety_bps: 8                           # 旧模式盈利性守卫额外安全垫；新模式主要使用 entry_floor
    tier_overrides:
      A:
        window_sec: 1.0                     # A 级流动性好，动量确认窗口更短
        min_samples: 3
        min_rise_bps: 3
        min_basis_buffer_bps: 6             # A 级安全垫略小
        safety_bps: 6                       # A 级旧模式盈利性守卫额外安全垫略小

  # ─── 回调后再突破开仓通道 ───
  # 用于 A/B 级标的：先等冲击释放和盘口恢复，但不在回调后立刻接单；
  # A 级若没命中 momentum，也必须走 rebound；B 级只走 rebound。
  # 只有基差从回调低点再次上行突破，才进入最终旁路和下单。
  rebound_open:
    enabled: true
    allowed_tiers: [A, B]
    min_rise_bps: 4                         # 从回调低点至少回升多少 bps
    min_slope_bps: 0.5                      # 当前样本相对上一样本仍需向上
    min_basis_buffer_bps: 4                 # 当前基差需至少高于 entry_floor 的额外安全垫
    max_wait_sec: 5.0                       # 回调恢复后最多等待普通二次突破多久
    high_funding_24h_bps: 50                # 24h资金费足够厚时，可给普通二次突破更长等待窗口
    high_funding_max_wait_sec: 10.0         # funding≥high_funding_24h_bps 时的普通二次突破最长等待
    strong_cushion_bps: 20                  # 若当前基差已高于 entry_floor 这么多，可走强安全垫确认
    strong_cushion_min_hold_sec: 1.0        # 强安全垫需连续保持多久，避免单跳误触发
    strong_cushion_max_wait_sec: 8.0        # 强安全垫活跃时最多等待确认多久

  # ─── 下单前执行质量保护 ───
  # 过滤 pre_gate 已经缺少安全垫、或相对峰值衰减太多的机会。
  execution_guard:
    enabled: true
    min_profit_buffer_bps: 15               # pre_gate 需高于 平仓阈值+全手续费 的额外安全垫
    min_p20_buffer_bps: 3                   # 新模式下表示 pre_gate 需高于 entry_floor 的额外安全垫
    max_peak_decay_bps: 45                  # pre_gate 相对峰值最多允许衰减

  # ─── Funding-adjusted 统一入场门槛 ───
  # entry_floor = max(
  #   fee_full_bps + slippage_buffer_bps + min_expected_edge_bps - funding_24h_bps * funding_capture_ratio,
  #   open_basis_p20 - min(max_funding_discount_bps, funding_24h_bps * discount_ratio)
  # )
  # funding 不够厚时，不允许低于 p20；funding 很厚时，也最多只给 max_funding_discount_bps 折扣。
  funding_adjusted_entry:
    enabled: true
    funding_capture_ratio: 0.5              # 只把 24h funding 的一部分计入本轮预期，避免高估收益
    min_expected_edge_bps: 0                # funding + basis - 手续费 - 滑点缓冲 至少为 0
    slippage_buffer_bps: 10                 # 统一预留成交滑点/冲击缓冲
    strong_funding_24h_bps: 50              # funding≥该值才允许低于 p20 少量入场
    discount_ratio: 0.2                     # funding 对 p20 的折扣比例
    max_funding_discount_bps: 10            # 最多比 p20 放宽 10bps，避免开在太差位置

  # ─── 高资金费 Carry 开仓通道 ───
  # 独立于 momentum / pullback / rebound：临近资金费结算且 funding 足够厚时，
  # 允许 basis 未达到原 entry_floor，但仍必须通过盘口恢复、最终旁路和执行保护。
  funding_carry_open:
    enabled: true
    allowed_tiers: [A, B]
    min_24h_bps: 30                         # 当前实时24h资金费率 >= 30bps
    basis_relax_bps: 15                     # current_basis >= max(开仓p20, 平仓p20) - 15bps
    max_next_funding_min: 30                # 距离下次资金费结算 <= 30分钟
    amount_usdt: 10                         # 单笔小仓位金额；设0则跟随 trade.open.amount_usdt

  # ─── 行情画像参数覆盖 ───
  # market_profile 不替代 A/B/C 分层：A/B/C 决定是否进交易池，
  # market_profile 决定行情稀疏/薄盘标的使用哪组监控和执行参数。
  market_profile:
    thin_bursty:
      enabled: true                         # 薄盘/跳动式更新标的启用专用参数
      open_amount_multiplier: 0.8           # 单笔金额为普通开仓的80%，避免触碰最低开仓金额
      max_orderbook_lag_ms: 1500            # 最终旁路仍检查新鲜度，但允许比 normal 更宽
      max_book_skew_ms: 1500                # Gate/Binance 两边最近更新相差过大仍拒单

  # ─── 信号降噪 / 执行质量冷却 ───
  rebound_timeout_cooldown:
    enabled: true
    cooldown_sec: 60                        # 回弹等待超时后短冷却，防止同一状态反复刷信号
    basis_change_reset_bps: 5               # 若基差相对超时点变化足够大，提前解除冷却

  asset_noise_cooldown:
    enabled: true
    lookback_min: 60                        # 单标的近 60 分钟信号过密且不开仓，则临时降噪
    max_signals: 100
    min_opened: 1
    cooldown_min: 10

  signal_cleanup:
    enabled: true
    interval_sec: 300                       # 定期清理超时未resolve的monitoring信号
    stale_monitoring_sec: 180
    batch_limit: 500

  execution_drift_cooldown:
    enabled: true
    max_drift_bps: 40                       # pre_gate_basis - actual_basis 超过该值，视为执行质量异常
    cooldown_hour: 0.5

  # ─── 开仓盘口恢复确认 ───
  # 当开仓信号已经完成“峰值回落”确认后，系统不会立刻下单，而是进入最多 3.0 秒的盘口恢复观察期；
  # 在这段时间里，至少需要采集到 3 个有效盘口样本；被冲击的开仓侧深度要恢复到监控起点的 65% 以上；
  # spot/future 的买卖价差相对窗口起点不能扩大超过 8bps；
  # 开仓基差在窗口内的波动不能超过 6bps。如果这些条件连续满足 0.4 秒，就认为盘口已经恢复，可以进入最终旁路检查并准备开仓；
  resiliency:
    enabled: true
    window_sec: 3.0                         # 最近窗口内观察盘口恢复
    min_samples: 2                          # 窗口内最少样本数
    min_recovery_ratio: 0.65                # 被冲击侧深度需恢复到监控起点的比例
    max_spread_widen_bps: 8                 # spot/future 买卖价差相对窗口起点最大扩大
    max_basis_volatility_bps: 6             # 窗口内开仓基差最大波动
    min_hold_sec: 0.4                       # 恢复条件连续满足时长
    max_wait_sec: 5.0                       # 等待恢复超时后放弃本轮信号

  # ─── 平仓策略 ───
  close:
    check_interval_sec: 0.2                 # 平仓检查间隔（秒）；与开仓对称
    cooldown_sec: 60                        # 平仓失败冷却（秒）
    take_profit_mode: fixed_net_bps         # 止盈模式：fixed_net_bps=固定净收益；legacy_p40=历史p40资金费倍数
    fixed_take_profit_bps: 200              # 固定净止盈阈值：收敛收益 + 已收资金费 - 全部手续费
    positive_funding_hold_enabled: true     # 若下一期正资金费仍厚，止盈达标也可暂缓到结算后
    positive_funding_hold_window_min: 60    # 距下一次资金费结算多少分钟内启用暂缓
    positive_funding_hold_min_bps: 5        # 下一期预计资金费 >= 此值时暂缓止盈
    negative_funding_exit_enabled: true     # 当前负24h费率临近结算/极端恶化，或历史实际负资金费成本过高时风险平仓
    negative_funding_exit_current_24h_bps: 21 # 当前24h负资金费率达到该阈值且临近结算才进入平仓
    negative_funding_exit_current_window_min: 30 # 距下一次资金费结算多少分钟内才触发当前负费率平仓
    negative_funding_exit_extreme_24h_bps: 45 # 当前24h负资金费率达到极端阈值时立即平仓
    negative_funding_exit_paid_bps: 7       # 历史实际已支付负资金费累计达到该阈值即进入平仓
    protective_ioc_enabled: true            # 平仓Gate期货腿使用 reduce_only 保护限价 IOC
    protective_ioc_take_profit_slippage_bps: 5 # 止盈平仓期货买回保护价允许高于旁路VWAP的bps
    protective_ioc_risk_slippage_bps: 12    # 风险平仓期货买回保护价允许高于旁路VWAP的bps
    take_profit_days_multiplier: 10         # legacy_p40模式止盈倍数
    # take_profit_days_multiplier: 2         # 止盈倍数（总盈亏bps >= percentile_40费率bps * 此值 + 手续费bps）
    max_funding_payments: 30                # 最大资金费支付次数，超过强制平仓
    # max_funding_payments: 2                # 最大资金费支付次数，超过强制平仓
    max_orderbook_lag_ms: 500               # 旁路风控新鲜度硬约束：本地最近一次 WS 盘口距下单时刻的最大允许延迟（ms）

  # ─── 谷底反弹策略（平仓确认） ───
  valley_rebound:
    rebound_pct: 0.10                       # 从谷底反弹百分比(10%)确认平仓
    monitor_timeout_sec: 60                 # 监控超时（秒），超时后直接平仓

  # ─── 止盈平仓盘口恢复确认 ───
  close_resiliency:
    enabled: true
    window_sec: 1.5
    min_samples: 3
    min_recovery_ratio: 0.55
    max_spread_widen_bps: 10
    max_basis_volatility_bps: 8
    max_basis_rebound_bps: 8                # 等待恢复期间平仓基差允许回弹上限
    min_hold_sec: 0.3
    max_wait_sec: 1.5                       # 止盈平仓等待超时后交给最终旁路判定，不无限等待
    coverage_threshold: 0.6

  # ─── VWAP基差阈值 ───
  vwap:
    snapshot_interval_sec: 10               # 快照采样间隔（秒）
    snapshot_retention_days: 60             # 快照保留天数
    update_threshold_enabled: true           # 是否由系统更新 mi_vwap_basis_threshold；false 时仅保留 mi_vwap_basis_snapshot 快照
    threshold_lookback_days: 7              # 阈值回溯天数（用于每日统计分析）
    # 平仓基差阈值分位列（旧模式用于开仓盈利性守卫；新模式主要用于平仓/复盘）
    # 可选值: close_basis_p10 / close_basis_p20
    close_threshold_percentile: close_basis_p20

  # ─── 持仓管理 ───
  position:
    funding_update_sec: 600                 # 资金费真实流水同步间隔（秒）
    funding_sync_lookback_days: 7           # Gate fund 流水回看天数，用于重启/漏记回补
    funding_update_offset_sec: 10           # 每个整点后多少秒检查资金费入账
    push_interval_sec: 5                    # 实时数据推送间隔（秒）

# 保证金风控配置（逐仓模式）
margin:
  # 杠杆倍数（用于计算初始保证金和爆仓价）
  leverage: 5
  # 默认维持保证金率（当合约表无数据时的回退值）
  default_maintenance_rate: 0.005
  # 保证金/维持保证金预警阈值(%): 低于此值时禁止该标的新开仓
  warning_pct: 250
  # 保证金/维持保证金自动追加阈值(%): 低于此值时先尝试追保
  topup_pct: 250
  # 保证金/维持保证金紧急平仓阈值(%): 低于此值且追保失败/不可追保才触发两端同时平仓
  close_threshold_pct: 150
  # 自动追加保证金策略：补到目标 保证金/维持保证金 比例
  topup:
    enabled: true
    target_maintenance_margin_rate_pct: 350
    max_topup_open_notional_multiplier: 2   # 累计追保金额最多为开仓名义金额的倍数；同合约多笔会按合约聚合
    min_gate_available: 50
    cooldown_sec: 60
    min_amount_usdt: 0.1
    snapshot_max_age_sec: 180
    hedge_balance_tolerance_pct: 5

# 真实成交引擎配置（仅 real_executor_service 使用）
# API Key/Secret 从 .env 环境变量读取，此处仅配置其他运行参数
# 注：交易所环境（mainnet/testnet）由顶层 trade.mode 统一控制，不再在此重复配置
real_executor:
  # HTTP 请求超时（秒）
  timeout_sec: 10

# 真实资金快照配置（Binance 现货 + Gate 期货）
account_capital:
  enabled: true
  snapshot_interval_sec: 60
  retention_days: 30
  pnl_lookback_days: 90
  max_age_sec: 180
  binance_margin:
    enabled: true
    warning_margin_level: 3.0
    min_open_margin_level: 2.5

# 基础持仓对账配置（Binance 现货 + Gate 期货；可识别 Gate ADL/断腿并标记持仓风险）
reconciliation:
  enabled: true
  interval_sec: 300
  retention_days: 30
  ignored_binance_spot_assets: [BNB]        # BNB 用作 Binance 手续费抵扣燃料，不参与套利持仓对账
  mark_exchange_risk: true                  # Gate 实仓少于本地持仓时，标记 mi_trade_position.exchange_risk_*
  adl_lookback_sec: 86400                   # 回查 Gate my_trades 识别 auto_deleveraging 的窗口（24小时）

# 反向资金费率套利（short spot + long future）
# 反向策略独立于正向策略；正向策略配置不复用这里的状态。
reverse_arbitrage:
  funding_capture_ratio: 0.5                # 边际盈亏中计入24h负费率的权重
  funding_carry:
    enabled: true
    min_24h_bps: 80                         # 可收24h负费率绝对值 >= 80bps
    max_next_funding_min: 60                # 距离下次资金费结算 <= 60分钟
    min_margin_edge_bps: 50                 # 边际盈亏至少 50bps
    basis_relax_bps: 30                     # reverse_basis <= min(开仓P20, 平仓P20) + 30bps
  research:
    enabled: true
    snapshot_interval_sec: 60               # 反向研究快照采集间隔；仅观测落库，不参与开仓
    max_rows_per_snapshot: 400
  signal:
    enabled: true
    check_interval_sec: 1.0
    monitor_timeout_sec: 60
    monitor_timeout_cooldown_sec: 10
    valley_rebound_pct: 0.05                # 基差触底后，按跌幅比例反弹确认
    min_rebound_bps: 2.0                    # 反弹确认的最小bps，避免低基数时过敏
    min_monitor_sec: 1.5
    rebound_sustain_sec: 0.4
    max_orderbook_lag_ms: 500
    reject_cooldown_sec: 60
    asset_noise_lookback_min: 60
    asset_noise_max_signals: 100
    asset_noise_min_opened: 1
    asset_noise_cooldown_min: 10
  execution:
    enabled: true                           # 反向执行器开关；下单链路仍走反向独立实现，不复用正向执行器
    dry_run: false                          # 反向开仓旁路通过后真实下单
    max_total_positions: 10                 # 反向最大持仓数，先限制不超过10个
    max_positions_per_asset: 2
    min_open_amount_usdt: 0                 # 0 表示第一版不做“有多少开多少”
    allow_partial_borrow_capacity: false    # 借币额度不足时不开仓
    reject_cooldown_sec: 60
    execution_drift_cooldown_sec: 1800
  close:
    enabled: false                          # 反向平仓执行器接入前保持关闭
    fixed_take_profit_bps: 20
    peak_retrace_pct: 0.05                  # 反向平仓基差见顶后回落确认
    monitor_timeout_sec: 60
    max_orderbook_lag_ms: 500
    orderbook_coverage_threshold: 0.6
  risk:
    funding_positive_exit_enabled: true     # funding 转正后按风险退出评估
    funding_positive_exit_current_24h_bps: 21
    funding_positive_exit_current_window_min: 30
    funding_positive_exit_extreme_24h_bps: 45
    borrow_hourly_rate_warn_bps: 2
    cross_margin_min_margin_level: 2.0
  reconciliation:
    enabled: false                          # 反向对账实现前保持关闭
    interval_sec: 300
  binance_margin:
    enabled: true
    cache_ttl_sec: 60
    max_borrowable_assets_per_refresh: 250
    timeout_sec: 10
    recv_window_ms: 10000
  borrow_overrides: {}

# Gate 私有风险事件监听：实时接收 ADL/强平事件并自动修复 Binance spot 裸腿
exchange_risk_monitor:
  enabled: true
  settle: usdt
  channels: [futures.auto_deleverages, futures.liquidates]
  subscribe_all: true
  reconnect_delay_sec: 3
  max_reconnect_delay_sec: 60
  reconnect_jitter_sec: 2
  connect_timeout_sec: 15
  rest_catchup_enabled: true                # WS 重连后回查最近事件，补偿断线窗口
  rest_catchup_lookback_sec: 300
  auto_remediate:
    enabled: true
    action: sell_spot                       # ADL/强平导致 Gate short 缺腿后，自动卖出裸 Binance spot
    max_positions_per_event: 20

orderbook:
  # 永续合约结算币种（小写），用于拼接 Gate 合约名（如 BTC_USDT）
  settle: usdt
  # WS 订阅标的分层白名单；默认只订阅 A/B，C 不进入 Gate/Binance WS，降低服务器压力
  strategy_tiers: [A, B]
  # 最大订阅合约数（从 mi_base_asset 加载的上限）
  max_contracts: 999
  # Gate OBU WS 连接分片数；若 max_contracts=250 且 level=50，建议设为 5
  gate_ws_shards: 5
  # Gate OBU 深度，实测可用: 50 / 400；系统输出仍只取前20档
  gate_obu_level: 50
  # Gate WS 建连等待时间；高延迟网络下需要比默认 8 秒更宽松
  gate_ws_connect_timeout_sec: 30
  # Gate 订阅/退订控制帧最小发送间隔（毫秒），覆盖启动订阅、重连补订阅和缺口重订阅
  gate_subscribe_interval_ms: 100
  # Gate WS 自动重连随机抖动上限（秒），避免多个分片同频重连
  gate_reconnect_jitter_sec: 2.0
  # Binance Spot WS 连接分片数；若 max_contracts=250 且 speed=100ms，建议设为 5
  binance_ws_shards: 5
  # Binance Partial Depth 推送频率，可选: 100ms / 1000ms
  binance_ws_speed: 100ms
  # 盘口超过该秒数无更新时，不参与交易计算
  stale_timeout_sec: 30
  # 进程启动后自动启动 WS 服务（设为 true 则崩溃重启后自动恢复连接）
  auto_start: true
  # 独立盘口数据服务地址。orderbook_server 通过该服务读取 Binance/Gate 本地盘口。
  data_service_url: http://127.0.0.1:19877
  data_service_host: 0.0.0.0
  data_service_port: 19877
  data_service_timeout_sec: 2.0

  # WebSocket 向前端广播订单簿快照的最小间隔（秒），用于节流
  broadcast_throttle_sec: 2.0

asset_market_profile:
  thin_spot_volume_24h_usdt: 1000000       # 低于该现货成交额的 A/B 标的标为 thin_bursty
  thin_future_volume_24h_usdt: 500000      # 低于该合约成交额的 A/B 标的标为 thin_bursty
